<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Shading Gradients -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#isoGrid)"/>

  <!-- Ambient Glow -->
  <circle cx="400" cy="300" r="260" fill="url(#glowGrad)"/>

  <!-- Technical Frame & Title Block -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,4"/>
  <rect x="28" y="28" width="744" height="544" fill="none" stroke="#475569" stroke-width="0.8"/>

  <!-- Corner Alignment Marks -->
  <path d="M 24 40 L 40 40 L 40 24 M 776 40 L 760 40 L 760 24 M 24 560 L 40 560 L 40 576 M 776 560 L 760 560 L 760 576" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Technical Telemetry Top Left -->
  <g font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#94a3b8">
    <text x="44" y="52" font-weight="700" fill="#38bdf8" letter-spacing="1">SOLIDWORKS 3D CAD MODEL</text>
    <text x="44" y="68" fill="#64748b">SCALE: 1:1  |  PROJECTION: THIRD ANGLE  |  STATUS: RELEASED</text>
  </g>

  <!-- Title Block Bottom Right -->
  <g transform="translate(480, 480)">
    <rect width="280" height="80" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="280" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">PART SPECIFICATION / GD&amp;T</text>
    <text x="12" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Self-Centering CNC Vise</text>
    <text x="12" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">DWG NO: <tspan fill="#f1f5f9" font-weight="600">VISE-SC-150</tspan> | MATL: <tspan fill="#f1f5f9" font-weight="600">Ductile Iron & 6061-T6</tspan></text>
    <text x="12" y="72" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">DESIGNER: DAMANJIT SINGH  |  VERIFIED DFM</text>
  </g>

  <!-- Coordinate Triad Bottom Left -->
  <g transform="translate(60, 520)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-22" y2="22" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#f8fafc"/>
    <text x="42" y="4" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ef4444">X</text>
    <text x="-4" y="-42" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#22c55e">Y</text>
    <text x="-32" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#3b82f6">Z</text>
  </g>

  <!-- Main CAD Model Geometry Render -->
    <g transform="translate(140, 120)">
    <!-- Base Casting -->
    <path d="M 60 260 L 260 360 L 460 260 L 260 160 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M 60 260 L 60 300 L 260 400 L 260 360 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <path d="M 260 360 L 260 400 L 460 300 L 460 260 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>

    <!-- Slideway Rails -->
    <path d="M 120 230 L 260 300 L 400 230 L 260 160 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 140 220 L 260 280 L 380 220 L 260 160 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Fixed Jaw Column -->
    <path d="M 120 180 L 180 210 L 180 150 L 120 120 Z" fill="url(#metalGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 180 210 L 320 140 L 320 80 L 180 150 Z" fill="#cbd5e1" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M 120 120 L 180 150 L 320 80 L 260 50 Z" fill="#f1f5f9" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Machinable Aluminum Soft Jaw Insert (Accent Color) -->
    <path d="M 180 210 L 220 230 L 360 160 L 320 140 Z" fill="url(#accentGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 220 230 L 220 190 L 360 120 L 360 160 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 180 170 L 220 190 L 360 120 L 320 100 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Movable Jaw Column -->
    <path d="M 260 300 L 300 320 L 440 250 L 400 230 Z" fill="url(#accentGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 300 320 L 300 280 L 440 210 L 440 250 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 260 260 L 300 280 L 440 210 L 400 190 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Precision Lead Screw -->
    <ellipse cx="260" cy="330" rx="14" ry="7" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="260" y1="337" x2="350" y2="292" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="260" y1="323" x2="350" y2="278" stroke="#cbd5e1" stroke-width="4"/>

    <!-- Dimension & GD&T Callouts -->
    <g stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3">
      <line x1="360" y1="120" x2="450" y2="80"/>
      <line x1="450" y1="80" x2="520" y2="80"/>
    </g>
    <rect x="470" y="65" width="105" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="478" y="82" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">// 0.010 [A]</text>
  </g>

</svg>