<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Shading Gradients -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#isoGrid)"/>

  <!-- Ambient Glow -->
  <circle cx="400" cy="300" r="260" fill="url(#glowGrad)"/>

  <!-- Technical Frame & Title Block -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,4"/>
  <rect x="28" y="28" width="744" height="544" fill="none" stroke="#475569" stroke-width="0.8"/>

  <!-- Corner Alignment Marks -->
  <path d="M 24 40 L 40 40 L 40 24 M 776 40 L 760 40 L 760 24 M 24 560 L 40 560 L 40 576 M 776 560 L 760 560 L 760 576" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Technical Telemetry Top Left -->
  <g font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#94a3b8">
    <text x="44" y="52" font-weight="700" fill="#38bdf8" letter-spacing="1">SOLIDWORKS 3D CAD MODEL</text>
    <text x="44" y="68" fill="#64748b">SCALE: 1:1  |  PROJECTION: THIRD ANGLE  |  STATUS: RELEASED</text>
  </g>

  <!-- Title Block Bottom Right -->
  <g transform="translate(480, 480)">
    <rect width="280" height="80" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="280" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">PART SPECIFICATION / GD&amp;T</text>
    <text x="12" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Cycloidal Speed Reducer</text>
    <text x="12" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">DWG NO: <tspan fill="#f1f5f9" font-weight="600">CYC-RD-85</tspan> | MATL: <tspan fill="#f1f5f9" font-weight="600">GCr15 & 40Cr Steel</tspan></text>
    <text x="12" y="72" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">DESIGNER: DAMANJIT SINGH  |  VERIFIED DFM</text>
  </g>

  <!-- Coordinate Triad Bottom Left -->
  <g transform="translate(60, 520)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-22" y2="22" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#f8fafc"/>
    <text x="42" y="4" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ef4444">X</text>
    <text x="-4" y="-42" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#22c55e">Y</text>
    <text x="-32" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#3b82f6">Z</text>
  </g>

  <!-- Main CAD Model Geometry Render -->
    <g transform="translate(150, 100)">
    <!-- Outer Ring Gear with Pin Rollers -->
    <circle cx="250" cy="240" r="140" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <circle cx="250" cy="240" r="115" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Ring Gear Pins (18 Pins) -->
    <g fill="url(#metalGrad)" stroke="#cbd5e1" stroke-width="1">
      <circle cx="250" cy="126" r="6"/>
      <circle cx="289" cy="133" r="6"/>
      <circle cx="323" cy="153" r="6"/>
      <circle cx="347" cy="183" r="6"/>
      <circle cx="358" cy="220" r="6"/>
      <circle cx="354" cy="259" r="6"/>
      <circle cx="336" cy="293" r="6"/>
      <circle cx="306" cy="318" r="6"/>
      <circle cx="269" cy="331" r="6"/>
      <circle cx="231" cy="331" r="6"/>
      <circle cx="194" cy="318" r="6"/>
      <circle cx="164" cy="293" r="6"/>
      <circle cx="146" cy="259" r="6"/>
      <circle cx="142" cy="220" r="6"/>
      <circle cx="153" cy="183" r="6"/>
      <circle cx="177" cy="153" r="6"/>
      <circle cx="211" cy="133" r="6"/>
    </g>

    <!-- Cycloidal Epitrochoid Lobed Disc (Accent Cyan) -->
    <path d="M 250 145 C 275 145, 285 160, 305 165 C 325 170, 335 190, 345 210 C 355 230, 345 250, 345 270 C 345 290, 330 305, 310 315 C 290 325, 270 330, 250 330 C 230 330, 210 325, 190 315 C 170 305, 155 290, 155 270 C 155 250, 145 230, 155 210 C 165 190, 175 170, 195 165 C 215 160, 225 145, 250 145 Z" fill="#0284c7" fill-opacity="0.85" stroke="#38bdf8" stroke-width="2"/>

    <!-- Drive Output Pin Holes (6 Holes) -->
    <g fill="#0b1120" stroke="#f8fafc" stroke-width="1.5">
      <circle cx="250" cy="180" r="16"/>
      <circle cx="302" cy="210" r="16"/>
      <circle cx="302" cy="270" r="16"/>
      <circle cx="250" cy="300" r="16"/>
      <circle cx="198" cy="270" r="16"/>
      <circle cx="198" cy="210" r="16"/>
    </g>

    <!-- Central Eccentric Bearing Hub -->
    <circle cx="250" cy="240" r="32" fill="url(#metalGrad)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="250" cy="240" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  </g>

</svg>