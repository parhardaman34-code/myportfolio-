<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Shading Gradients -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#isoGrid)"/>

  <!-- Ambient Glow -->
  <circle cx="400" cy="300" r="260" fill="url(#glowGrad)"/>

  <!-- Technical Frame & Title Block -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,4"/>
  <rect x="28" y="28" width="744" height="544" fill="none" stroke="#475569" stroke-width="0.8"/>

  <!-- Corner Alignment Marks -->
  <path d="M 24 40 L 40 40 L 40 24 M 776 40 L 760 40 L 760 24 M 24 560 L 40 560 L 40 576 M 776 560 L 760 560 L 760 576" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Technical Telemetry Top Left -->
  <g font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#94a3b8">
    <text x="44" y="52" font-weight="700" fill="#38bdf8" letter-spacing="1">SOLIDWORKS 3D CAD MODEL</text>
    <text x="44" y="68" fill="#64748b">SCALE: 1:1  |  PROJECTION: THIRD ANGLE  |  STATUS: RELEASED</text>
  </g>

  <!-- Title Block Bottom Right -->
  <g transform="translate(480, 480)">
    <rect width="280" height="80" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="280" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">PART SPECIFICATION / GD&amp;T</text>
    <text x="12" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Carbon Drone Airframe</text>
    <text x="12" y="58" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">DWG NO: <tspan fill="#f1f5f9" font-weight="600">UAV-CF-280</tspan> | MATL: <tspan fill="#f1f5f9" font-weight="600">3K Toray T700 Carbon</tspan></text>
    <text x="12" y="72" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">DESIGNER: DAMANJIT SINGH  |  VERIFIED DFM</text>
  </g>

  <!-- Coordinate Triad Bottom Left -->
  <g transform="translate(60, 520)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-22" y2="22" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#f8fafc"/>
    <text x="42" y="4" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ef4444">X</text>
    <text x="-4" y="-42" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#22c55e">Y</text>
    <text x="-32" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#3b82f6">Z</text>
  </g>

  <!-- Main CAD Model Geometry Render -->
    <g transform="translate(150, 100)">
    <!-- Central Deck Plates (Top and Bottom) -->
    <polygon points="200,160 280,160 330,210 310,270 230,290 170,240" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <polygon points="205,165 275,165 320,210 305,260 235,280 180,235" fill="#27272a" stroke="#71717a" stroke-dasharray="2,2"/>

    <!-- 4 Interlocking Carbon Arms -->
    <!-- Front Left Arm -->
    <path d="M 180 200 L 70 120 L 90 100 L 200 180 Z" fill="#09090b" stroke="#52525b" stroke-width="2"/>
    <!-- Front Right Arm -->
    <path d="M 300 180 L 410 100 L 430 120 L 320 200 Z" fill="#09090b" stroke="#52525b" stroke-width="2"/>
    <!-- Rear Left Arm -->
    <path d="M 190 260 L 80 340 L 100 360 L 210 280 Z" fill="#09090b" stroke="#52525b" stroke-width="2"/>
    <!-- Rear Right Arm -->
    <path d="M 310 260 L 420 340 L 440 320 L 330 240 Z" fill="#09090b" stroke="#52525b" stroke-width="2"/>

    <!-- 4 CNC Anodized Motor Mounts (Red) -->
    <g fill="#ef4444" stroke="#fca5a5" stroke-width="1.5">
      <circle cx="80" cy="110" r="18"/>
      <circle cx="420" cy="110" r="18"/>
      <circle cx="90" cy="350" r="18"/>
      <circle cx="430" cy="330" r="18"/>
    </g>
    <!-- Stator Holes -->
    <g fill="#18181b">
      <circle cx="80" cy="110" r="6"/>
      <circle cx="420" cy="110" r="6"/>
      <circle cx="90" cy="350" r="6"/>
      <circle cx="430" cy="330" r="6"/>
    </g>

    <!-- Carbon Fiber 3K Weave Detail -->
    <text x="185" y="225" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">3K TORAY T700</text>
    <text x="195" y="240" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">3.0mm QUASI-ISOTROPIC</text>
  </g>

</svg>